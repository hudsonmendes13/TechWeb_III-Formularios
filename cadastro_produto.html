<h1 style="margin-top: 2rem;text-align: center; color: aliceblue;font-family: Impact, Haettenschweiler, 'Arial Narrow', sans-serif;">CADASTRO DE PRODUTO</h1>
<div class="container">
    <form class="row g-3">
         <div class="col-12">
            <label for="inputName" class="form-label">Nome</label>
            <input type="text" class="form-control" id="inputName">
        </div>
        <div class="col-md-6">
            <label for="inputEmail4" class="form-label">Valor (R$)</label>
            <input type="email" class="form-control" id="inputEmail4">
        </div>
        <div class="col-md-6">
            <label for="inputPassword4" class="form-label">Código de identificação</label>
            <input type="password" class="form-control" id="inputPassword4">
        </div>
        <div class="col-8">
            <label for="inputAddress" class="form-label">Descrição</label>
            <input type="text" class="form-control" id="inputAddress">
        </div>
        <div class="col-md-4">
            <label for="inputState" class="form-label">Tipo de venda</label>
            <select id="inputState" class="form-select">
                <option selected>Selecione...</option>
                <option>Varejo</option>
                <option>Ecomerce</option>
                <option>Ambos</option>
            </select>
        </div>
        <div class="col-12">
            <a type="submit" class="btn btn-secondary" href="principal.html">SALVAR</a>
        </div>
    </form>
