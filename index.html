<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.8)), url('img/fundo.jpg');
            background-position: center;
        }

        .container {
            display: flex;
            height: 100%;
            width: 100%;
            justify-content: center;
            align-items: center;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Tela de login</title>
</head>

<body>
    <div class="container">
        <div class="card mb-3" style="border-color: rgb(0, 0, 0); width: 60%; background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(121, 121, 121, 0.144));">
            <div class="row g-0">
                <div class="col-md-4">
                    <img src="img/dedos.jpg" class="img-fluid rounded-start" style="height: 300px;width: auto;object-fit: cover; object-position: center center;">
                </div>
                <div class="col-md-8">
                    <div class="card-body">
                        <h5 class="card-title" style="color: aliceblue;">FAÇA SEU LOGIN</h5>
                        <form>
                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label" style="color: rgb(143, 143, 143);">Email</label>
                                <input type="email" class="form-control" id="exampleInputEmail1"
                                    aria-describedby="emailHelp">
                            </div>
                            <div class="mb-3">
                                <label for="exampleInputPassword1" class="form-label" style="color: rgb(143, 143, 143);">Password</label>
                                <input type="password" class="form-control" id="exampleInputPassword1">
                            </div>
                            <a type="submit" class="btn btn-secondary" style="width: 8rem;" href="principal.html">Acessar</a>
                        </form>
                        <p class="card-text" style="color: rgb(46, 91, 150); margin-top: 2px; margin-top: 8px; margin-bottom: -5px;">Esqueci minha senha</small></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
